name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: Verify manifest version matches tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version ($VERSION) must match tag (${GITHUB_REF_NAME})"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            freedraw-pdf ${{ github.ref_name }}

            - Built from the tagged source by GitHub Actions.
            - Includes manifest.json, main.js, and styles.css for Obsidian manual installation.
            - Release artifacts are covered by GitHub artifact attestations.
            - Expands text formatting and editing behavior, including keyboard navigation and export/embed fidelity.
            - Aligns text, pen, and highlighter color controls and popup spacing.
            - Keeps page action menus above the Pages dialog.
            - Improves retained-stroke rendering, atomic erasing, touch admission, and render/input scheduling.

            Known limitation: rapid consecutive drawing with primary touch in Obsidian on iPad can still miss input while a previous page rebuild is active. This remains under investigation.
          files: |
            manifest.json
            main.js
            styles.css
